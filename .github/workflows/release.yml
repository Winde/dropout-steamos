name: Release

# A release is a tag. Pushing a vMAJOR.MINOR.PATCH tag verifies the commit,
# runs the checks, builds the AppImage, writes the notes from the commits since
# the previous release, and publishes a release named after the tag.
#
# Notes come from the commits themselves: a commit body is a section of the
# release, a commit without one is a line under "Changes", and commits that
# only ship the repository (release:, ci:, chore:…) are left out. See
# docs/releasing.md.
#
# Actions -> Release -> Run workflow is still there for a dry run: it builds
# and tests any commit without touching a release.
#
# The release is created as a draft after the build passes, filled, and
# published last, so a release is never visible without its assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only; do not touch the release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags have to be present to resolve this release and the previous
          # one; main has to be present to check the tag is on it.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve the release tag
        id: tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # vMAJOR.MINOR.PATCH, with optional prerelease/build suffix.
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          tags=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [[ "$name" =~ $pattern ]]; then
              tags+=("$name")
            fi
          done < <(git tag --points-at "$GITHUB_SHA")

          if [ "${#tags[@]}" -eq 0 ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::Dry run on untagged commit ${GITHUB_SHA}; building it as-is."
              exit 0
            fi
            echo "::error::Commit ${GITHUB_SHA} is not tagged vMAJOR.MINOR.PATCH. Tag it and push the tag."
            exit 1
          fi

          if [ "${#tags[@]}" -gt 1 ]; then
            echo "::error::Commit ${GITHUB_SHA} carries more than one release tag (${tags[*]}); leave exactly one."
            exit 1
          fi

          tag="${tags[0]}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${tag}"

      - name: Tag is on main
        if: ${{ steps.tag.outputs.tag != '' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::${GITHUB_SHA} is not on main. Merge it first, or tag the merge commit."
            exit 1
          fi

      - name: Tag matches package.json
        id: version
        if: ${{ steps.tag.outputs.tag != '' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json v${version}."
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # A tag that disagrees with the commit it names is not a version, and
      # leaving it would become the previous tag for the next release. Remove
      # it — but only for this exact failure, only while it still points at the
      # commit this run checked, and never one that already has a release.
      - name: Remove the rejected tag
        if: ${{ failure() && !inputs.dry_run && steps.version.outputs.mismatch == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse "${TAG}^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::notice::${TAG} no longer points at ${GITHUB_SHA}; leaving it alone."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::${TAG} already has a release; leaving the tag alone."
            exit 0
          fi
          if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"; then
            echo "::warning::Could not remove ${TAG}; a tag ruleset may block deletions. Delete it by hand."
            exit 0
          fi
          echo "::notice::Removed ${TAG}. Bump package.json, commit, tag again and push."

      - name: Check the installer
        run: bash -n packaging/install.sh

      - run: npm ci

      - run: npm run verify

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # github.sha is the commit the run started from, which is the tag's commit.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        run: npx electron-builder --linux AppImage --publish never

      - name: Package installer and artwork
        run: |
          set -euo pipefail
          cp packaging/install.sh release/install.sh
          chmod +x release/install.sh
          (cd packaging/steam-art \
            && zip -q "$GITHUB_WORKSPACE/release/steam-art.zip" \
                 hero.png portrait.png header.png logo.png icon.png NOTICE.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            release/*.AppImage
            release/install.sh
            release/steam-art.zip
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish
    needs: [verify, linux]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # The notes come from git, so this job needs the history and the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: node scripts/release-notes.mjs "$TAG" > notes.md

      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists; its notes are kept."
            exit 0
          fi
          args=(--draft --title "$TAG" --notes-file notes.md)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${args[@]}"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release upload "$TAG" artifacts/* --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
