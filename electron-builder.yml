appId: tv.drop-in.linux
productName: Drop-In
copyright: Unofficial client. Not affiliated with Dropout.
# The release artifact name; arch is x86_64 for the AppImage.
artifactName: Drop-In-${version}-${arch}.${ext}

directories:
  buildResources: build
  output: release

files:
  - dist/**
  - package.json

# Ship the licences next to the app, not just in the repository.
extraFiles:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: licenses
    to: licenses

asar: true

linux:
  target:
    - AppImage
  category: AudioVideo
  executableName: drop-in
  # The installed .desktop filename, StartupWMClass and Electron's app_id all
  # come from desktopName in package.json, so window association works.
  syncDesktopName: true
  synopsis: Unofficial Drop-In client
  desktop:
    entry:
      Name: Drop-In
      Comment: Unofficial Drop-In client for Dropout, made for a controller
      Categories: AudioVideo;Video;
      Keywords: dropout;streaming;tv;
